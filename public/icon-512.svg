<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Outer Glow Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="url(#accent)" opacity="0.08" filter="blur(30px)"/>
  
  <!-- Wallet Body Shape -->
  <rect x="96" y="140" width="320" height="232" rx="36" fill="url(#accent)" filter="url(#glow)"/>
  
  <!-- Wallet Flap & Interior -->
  <rect x="112" y="156" width="288" height="200" rx="28" fill="#0f172a" opacity="0.88"/>
  
  <!-- Central Digital Go Badge -->
  <path d="M190 200 L322 200 C340 200 354 214 354 232 L354 280 C354 298 340 312 322 312 L190 312 C172 312 158 298 158 280 L158 232 C158 214 172 200 190 200 Z" fill="url(#bg)" stroke="url(#accent)" stroke-width="6"/>
  
  <!-- Gold Security Coin -->
  <circle cx="330" cy="256" r="28" fill="url(#gold)" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.4))"/>
  <circle cx="330" cy="256" r="22" fill="none" stroke="#fef3c7" stroke-width="2"/>
  <text x="330" y="264" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#78350f" text-anchor="middle">৳</text>
  
  <!-- Brand Letter E & Go Lightning -->
  <text x="210" y="272" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="-2">E</text>
  <path d="M255 230 L275 230 L260 256 L282 256 L248 290 L256 264 L242 264 Z" fill="url(#accent)"/>
  
  <!-- Bottom Text Label -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#5eead4" text-anchor="middle" letter-spacing="4">E-WALLET GO</text>
</svg>
